name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: php-actions/composer@v6
        with:
          php_version: ${{ matrix.php }}
          php_extensions: json
          args: install --no-interaction --no-progress

      - name: Run tests
        run: ./bin/go test

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: php-actions/composer@v6
        with:
          php_version: '8.4'
          php_extensions: json
          args: install --no-interaction --no-progress

      - name: PHPStan
        uses: php-actions/phpstan@v1
        with:
          php_version: '8.4'
          level: 4
          path: src
          args: --no-progress

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: php-actions/composer@v6
        with:
          php_version: '8.4'
          php_extensions: json
          args: install --no-interaction --no-progress

      - name: Check code style
        run: ./bin/go lint-check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security scan (Trivy)
        run: ./bin/go security-check
